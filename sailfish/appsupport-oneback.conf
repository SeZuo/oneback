# Installed by the OneBack package as a drop-in for appsupport@.service:
# when AppSupport starts and a OneBack install is pending for this user
# (package installed or updated while AppSupport was stopped), install it now.
# "+" runs the check as root (AppSupport itself runs as appsupport-root),
# "-" keeps any failure here from affecting AppSupport.
[Service]
ExecStartPost=-+/bin/sh -c 'if [ -e /var/lib/oneback/pending-%i ]; then systemctl --no-block start oneback-install@%i.service; fi'
